<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Panel Administrador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngIf="usuario">
    <ion-card-header>
      <ion-card-title>Bienvenido, {{ usuario.nombre }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Aquí puedes gestionar doctores, farmacéuticos y más.
    </ion-card-content>
  </ion-card>
</ion-content>
