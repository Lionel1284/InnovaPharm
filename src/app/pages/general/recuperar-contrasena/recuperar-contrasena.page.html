<ion-header>
  <ion-toolbar color="primary">
    <ion-title></ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Volver"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="light">
  <ion-card class="card-recuperacion">
    <ion-card-header>
      <ion-card-title class="titulo">¿Olvidaste tu contraseña?</ion-card-title>
      <ion-card-subtitle>Ingresa tu correo registrado y te enviaremos un enlace para recuperarla.</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="onSubmit()">
        <ion-item lines="inset">
          <ion-icon slot="start" name="mail-outline"></ion-icon>
          <ion-label position="floating">Correo Electrónico</ion-label>
          <ion-input
            type="email"
            [(ngModel)]="correo"
            name="correo"
            required
            clearInput
          ></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" color="primary" class="ion-margin-top">
          Enviar enlace de recuperación
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
