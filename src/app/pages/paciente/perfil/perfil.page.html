<ion-content class="paciente-curva-header" fullscreen>
  <!-- Encabezado -->
  <header class="header-container">
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/paciente"></ion-back-button>
    </ion-buttons>

    <h1 class="titulo">InnovaPharm</h1>

    <div class="curva-blanca">
      <ion-icon name="person-circle-outline" size="large"></ion-icon>

      <!-- RUT debajo del icono -->
      <div class="rut-info" *ngIf="(usuario$ | async)?.rut">
        <ion-label class="rut-label">RUT: {{ (usuario$ | async)?.rut }}</ion-label>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main>
    <div class="perfil-container" *ngIf="usuario">
      <form (ngSubmit)="guardarCambios()">
        <section class="form-section">
          <ion-item>
            <ion-label position="floating">Nombre</ion-label>
            <ion-input [(ngModel)]="usuario.nombre" name="nombre"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Apellido Paterno</ion-label>
            <ion-input [(ngModel)]="usuario.apellidoPaterno" name="apellidoPaterno"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Apellido Materno</ion-label>
            <ion-input [(ngModel)]="usuario.apellidoMaterno" name="apellidoMaterno"></ion-input>
          </ion-item>
        </section>

        <section class="readonly-section">
          <ion-item>
            <ion-label position="floating">Correo</ion-label>
            <ion-input [(ngModel)]="usuario.correo" name="correo" readonly></ion-input>
          </ion-item>
        </section>

        <div class="form-actions">
          <ion-button expand="block" type="submit" class="guardar-btn">
            Guardar Cambios
          </ion-button>
        </div>
      </form>
    </div>
  </main>
</ion-content>
