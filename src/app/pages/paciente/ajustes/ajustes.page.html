<ion-content class="paciente-curva-header" fullscreen>
  <div class="header-container">
    <h1 class="titulo">InnovaPharm</h1>
    <div class="curva-blanca">
      <!-- TARJETA USUARIO CLICKABLE -->
      <div class="tarjeta-usuario" (click)="irAPerfil()">
        <div class="datos">
          <h5>{{ nombreCompleto }}</h5>
          <p>{{ (usuario$ | async)?.correo }}</p>
          <label class="rut-label" *ngIf="(usuario$ | async)?.rut">
            {{ (usuario$ | async)?.rut }}
          </label>
        </div>
        <ion-icon name="person-circle-outline" class="icono-perfil"></ion-icon>
      </div>
    </div>
  </div>

  <div class="opciones-ajustes">
    <ion-item lines="full" (click)="irAccesibilidad()">
      <ion-icon slot="start" name="accessibility-outline"></ion-icon>
      <ion-label>Accesibilidad</ion-label>
    </ion-item>

    <ion-item lines="full" (click)="irAjustesNotificaciones()">
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-label>Ajuste de notificaciones</ion-label>
    </ion-item>

    <ion-item lines="full" (click)="irTerminosUso()">
      <ion-icon slot="start" name="information-circle-outline"></ion-icon>
      <ion-label>Términos de uso</ion-label>
    </ion-item>

    <ion-item lines="full" (click)="cerrarSesion()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>
  </div>
</ion-content>
